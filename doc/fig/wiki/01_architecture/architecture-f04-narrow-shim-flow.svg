<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="#3A414A" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Narrow-port adaptation</title>
  <desc id="figDesc">Narrow reads use optional reorder and per-ID offset state, then either hit a one-line buffer or issue an aligned wide read. Narrow writes use an ordered AW FIFO, lane placement, byte enables, and same-line buffer merge before reaching the wide cache interface.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 13 11" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L13 5.5 L0 11 Z" fill="#1071E5"/></marker>
    <marker id="arrow-green" viewBox="0 0 13 11" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L13 5.5 L0 11 Z" fill="#008A0E"/></marker>
    <style>
      :root{color-scheme:light dark}
      @media (prefers-color-scheme:dark){
        [stroke="#000000"]{stroke:#E7E2D9}[fill="#3A414A"]{fill:#E7E2D9}[stroke="#3A414A"]{stroke:#E7E2D9}
        [fill="#979EA8"]{fill:#A8ADB0}[stroke="#979EA8"]{stroke:#A8ADB0}
        [fill="#F7F4E4"]{fill:#24282B}[stroke="#F7F4E4"]{stroke:#24282B}
        [fill="#C1E4F7"]{fill:#29363B}[stroke="#C1E4F7"]{stroke:#29363B}
        [fill="#D7FAF5"]{fill:#28392C}[stroke="#D7FAF5"]{stroke:#28392C}
        [fill="#A7A6FF"]{fill:#332F39}[stroke="#A7A6FF"]{stroke:#332F39}
        [fill="#FFDDA6"]{fill:#3D3526}[stroke="#FFDDA6"]{stroke:#3D3526}
        [fill="#1071E5"]{fill:#9CB8E8}[stroke="#1071E5"]{stroke:#9CB8E8}
        [fill="#008A0E"]{fill:#92C89A}[stroke="#008A0E"]{stroke:#92C89A}
        [fill="#635DFF"]{fill:#B5A8C0}[stroke="#635DFF"]{stroke:#B5A8C0}
        [fill="#CC4E00"]{fill:#D6A071}[stroke="#CC4E00"]{stroke:#D6A071}
      }
      .sans{font-family:Inter,Helvetica,Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:46px;font-weight:700}.pane{font-size:30px;font-weight:700}.block{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:20px}
    </style>
  </defs>

  <rect x="20" y="10" width="1560" height="145" rx="8" fill="#F7F4E4"/>
  <text x="50" y="70" class="sans title">Narrow-port adaptation</text>
  <text x="50" y="110" class="sans body">Per-ID state preserves ownership while the shim aligns, slices, places, and merges wide cache beats</text>
  <line x1="50" y1="140" x2="1550" y2="140" stroke="#979EA8" stroke-width="1"/>

  <rect x="50" y="205" width="200" height="110" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
  <text x="150" y="250" text-anchor="middle" class="sans block">narrow AXI</text>
  <text x="150" y="282" text-anchor="middle" class="mono small">NARROW_W</text>
  <rect x="300" y="205" width="200" height="110" rx="8" fill="#A7A6FF" stroke="#000000" stroke-width="2"/>
  <text x="400" y="244" text-anchor="middle" class="sans block">read reorder</text>
  <text x="400" y="276" text-anchor="middle" class="mono small">optional read</text>
  <rect x="550" y="205" width="200" height="110" rx="8" fill="#FFDDA6" stroke="#000000" stroke-width="2"/>
  <text x="650" y="244" text-anchor="middle" class="sans block">per-ID state</text>
  <text x="650" y="276" text-anchor="middle" class="mono small">offset + tag</text>
  <rect x="800" y="205" width="200" height="110" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="900" y="244" text-anchor="middle" class="sans block">line buffer</text>
  <text x="900" y="276" text-anchor="middle" class="mono small">line tag + data</text>
  <rect x="1050" y="205" width="200" height="110" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="1150" y="244" text-anchor="middle" class="sans block">lane adapter</text>
  <text x="1150" y="276" text-anchor="middle" class="mono small">slice + WSTRB</text>
  <rect x="1300" y="205" width="200" height="110" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
  <text x="1400" y="250" text-anchor="middle" class="sans block">wide cache AXI</text>
  <text x="1400" y="282" text-anchor="middle" class="mono small">BLOCK_W</text>
  <g fill="none" stroke="#1071E5" stroke-width="3" marker-end="url(#arrow-blue)">
    <path d="M254 260 H296"/><path d="M504 260 H546"/><path d="M754 260 H796"/><path d="M1004 260 H1046"/><path d="M1254 260 H1296"/>
  </g>

  <rect x="50" y="410" width="720" height="330" rx="8" fill="#F7F4E4" stroke="#000000" stroke-width="2"/>
  <text x="75" y="452" class="sans pane" fill="#1071E5">Read path</text>
  <rect x="80" y="500" width="170" height="78" rx="8" fill="#A7A6FF" stroke="#000000" stroke-width="2"/>
  <text x="165" y="534" text-anchor="middle" class="sans block">classify</text>
  <text x="165" y="560" text-anchor="middle" class="mono small">buffer hit?</text>
  <rect x="310" y="464" width="190" height="74" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="405" y="496" text-anchor="middle" class="sans block">buffer word</text>
  <text x="405" y="522" text-anchor="middle" class="mono small">no wide AR</text>
  <rect x="310" y="570" width="190" height="74" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
  <text x="405" y="602" text-anchor="middle" class="sans block">aligned AR</text>
  <text x="405" y="628" text-anchor="middle" class="mono small">one beat</text>
  <rect x="560" y="500" width="180" height="78" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="650" y="534" text-anchor="middle" class="sans block">narrow R</text>
  <text x="650" y="560" text-anchor="middle" class="mono small">held to RREADY</text>
  <rect x="560" y="620" width="180" height="74" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="650" y="652" text-anchor="middle" class="sans block">wide R slice</text>
  <text x="650" y="678" text-anchor="middle" class="mono small">refresh buffer</text>
  <g fill="none" stroke="#1071E5" stroke-width="3" marker-end="url(#arrow-blue)">
    <path d="M254 525 H280 V501 H306"/><path d="M504 501 H556"/><path d="M254 553 H280 V607 H306"/><path d="M504 607 H530 V657 H556"/><path d="M650 616 V582"/>
  </g>

  <rect x="810" y="410" width="740" height="330" rx="8" fill="#F7F4E4" stroke="#000000" stroke-width="2"/>
  <text x="835" y="452" class="sans pane" fill="#008A0E">Write path</text>
  <rect x="840" y="500" width="170" height="78" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="925" y="534" text-anchor="middle" class="sans block">narrow AW</text>
  <text x="925" y="560" text-anchor="middle" class="mono small">offset + tag</text>
  <rect x="1060" y="500" width="180" height="78" rx="8" fill="#FFDDA6" stroke="#000000" stroke-width="2"/>
  <text x="1150" y="534" text-anchor="middle" class="sans block">ordered FIFO</text>
  <text x="1150" y="560" text-anchor="middle" class="mono small">AW → W context</text>
  <rect x="1290" y="500" width="220" height="78" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="1400" y="534" text-anchor="middle" class="sans block">wide AW / W</text>
  <text x="1400" y="560" text-anchor="middle" class="mono small">lane + byte mask</text>
  <rect x="1060" y="630" width="180" height="74" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
  <text x="1150" y="662" text-anchor="middle" class="sans block">write merge</text>
  <text x="1150" y="688" text-anchor="middle" class="mono small">match merge</text>
  <rect x="1290" y="630" width="220" height="74" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
  <text x="1400" y="662" text-anchor="middle" class="sans block">B passthrough</text>
  <text x="1400" y="688" text-anchor="middle" class="mono small">BID + BRESP</text>
  <g fill="none" stroke="#008A0E" stroke-width="3" marker-end="url(#arrow-green)">
    <path d="M1014 539 H1056"/><path d="M1244 539 H1286"/><path d="M1150 582 V626"/><path d="M1400 582 V626"/>
  </g>

  <rect x="50" y="785" width="1500" height="75" rx="8" fill="#F7F4E4" stroke="#000000" stroke-width="2"/>
  <text x="80" y="830" class="sans body"><tspan font-weight="700" fill="#635DFF">Invariant:</tspan> one read per core ID, one AW context per W beat, and one sticky owner for a stalled narrow response.</text>
</svg>
