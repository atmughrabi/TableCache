name: regression

on:
  push:
    branches: [main, verification-and-shim]
  pull_request:
    branches: [main, verification-and-shim]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 300 || 45 }}
    steps:
      - uses: actions/checkout@v4

      # Cache the *built* Verilator install dir, not just the apt archive.
      # Building Verilator 5.020 from source on a 2-core GitHub runner takes
      # ~10-15 min and was the main reason the 25-min job timeout was tight.
      - name: Cache built Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/verilator
            /usr/local/bin/verilator_*
            /usr/local/share/verilator
          key: verilator-bin-${{ runner.os }}-5.020

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-verilator-5.020

      - name: Install Verilator 5.020 + Python deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make autoconf g++ flex bison ccache \
            libunwind-dev libgoogle-perftools-dev numactl perl-doc \
            libfl2 libfl-dev zlib1g zlib1g-dev \
            help2man python3 python3-pip python3-venv tcl
          # Build Verilator 5.020 if cache restore is incomplete.
          # A stale/partial cache can leave the binary present but miss
          # built-in include files (verilated_std.sv), which breaks lint.
          if ! command -v verilator >/dev/null || \
             ! verilator --version | grep -q '5\.020' || \
             [ ! -f /usr/local/share/verilator/include/verilated_std.sv ]; then
            git clone --depth 1 --branch v5.020 https://github.com/verilator/verilator.git /tmp/verilator
            cd /tmp/verilator
            autoconf && ./configure --prefix=/usr/local
            make -j"$(nproc)"
            sudo make install
          fi
          verilator --version
          test -f /usr/local/share/verilator/include/verilated_std.sv

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('tb/cocotb/requirements.txt') }}

      - name: Python venv + cocotb stack
        working-directory: tb/cocotb
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Lint
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          make lint
          python3 ../../doc/check_docs.py

      - name: Vivado generic literal unit
        run: tclsh syn/vivado/test_generic_literals.tcl

      - name: Verible semantic lint
        run: |
          set -eux
          curl -fsSL -o /tmp/verible.tar.gz \
            "https://github.com/chipsalliance/verible/releases/download/v0.0-4053-g89d4d98a/verible-v0.0-4053-g89d4d98a-linux-static-x86_64.tar.gz"
          tar -xzf /tmp/verible.tar.gz -C /tmp
          sudo cp /tmp/verible-v0.0-4053-g89d4d98a/bin/verible-verilog-lint /usr/local/bin/
          verible-verilog-lint --rules_config_search src/*.sv
          echo "verible: clean"

      - name: Smoke + flush + lru_sanity + cbom
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          for mod in test_smoke test_lru_sanity test_flush test_l2top_flush \
                     test_cbom test_cbom_rmw_race test_latency test_shim_latency; do
            rm -rf sim_build sim_build_shim
            timeout 300 make MODULE=$mod
          done
          for ways in 3 4 5; do
            rm -rf sim_build
            timeout 300 make MODULE=test_second_chance \
              POLICY=SECOND_CHANCE WAYS=$ways
          done
          rm -rf sim_build
          POLICY=LRU NTXN=2000 TC_POOL_LINES=1024 \
            timeout 900 make MODULE=test_workload

      - name: Read every block of a line incl. odd (matched-width data-correctness)
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Every LINE_W block (incl. odd blocks) must return correct data after a
          # cold fill across representative WAYS/VICTIM/DB_LATENCY settings at
          # BLOCK_W=32/LINE_W=8. Guards against a databank fill/read that drops odd
          # blocks (the mem-side must match BLOCK_W; see README AXI4 limitations).
          for w in 1 2 4 8; do
            rm -rf sim_build
            timeout 300 make MODULE=test_line_allwords WAYS=$w VICTIM=1 LINE_W=8 POLICY=LRU
          done
          rm -rf sim_build
          timeout 300 make MODULE=test_line_allwords WAYS=1 VICTIM=1 LINE_W=8 POLICY=LRU DB_LATENCY=2

      - name: Random (short)
        working-directory: tb/cocotb
        env:
          NTXN: "100"
        run: |
          . .venv/bin/activate
          rm -rf sim_build
          timeout 300 make MODULE=test_random

      - name: Base-0 full-range address reconstruction
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          for mod in test_eviction test_flush; do
            rm -rf sim_build
            timeout 400 make MODULE=$mod ADDR_L=0 ADDR_H=0xFFFFFFFF
          done

      - name: 64-bit address reconstruction and writeback
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Full 64-bit range: test_smoke sets bit 63 and checks the exact
          # pre-mask memory AR, so truncating the upper address half fails.
          rm -rf sim_build
          timeout 300 make MODULE=test_smoke ADDR_W=64 \
            ADDR_L=0 ADDR_H=0xFFFFFFFFFFFFFFFF
          # High 4 GiB window: dirty evictions and victim writebacks must retain
          # the fixed bit-32 prefix when reconstructing memory-side addresses.
          rm -rf sim_build
          timeout 400 make MODULE=test_eviction VICTIM=1 ADDR_W=64 \
            ADDR_L=0x100000000 ADDR_H=0x1FFFFFFFF

      - name: Shim regression
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          for mod in test_narrow_shim test_shim_cache test_shim_throughput test_shim_multiread test_shim_buffer_snapshot; do
            rm -rf sim_build sim_build_shim
            timeout 300 make MODULE=$mod
          done
          rm -rf sim_build sim_build_shim
          TC_PROMOTE_WMISS=1 ASSERT=1 timeout 300 make MODULE=test_shim_prefill_race

      - name: Critical-word-first WRAP line-fill contract
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Direct-mapped deployment geometry: every critical block/lane, AR metadata,
          # backpressure, same-id ROB overlap, and deterministic refill.
          rm -rf sim_build
          timeout 400 make MODULE=test_shim_cache \
           WIDE_W=32 NARROW_W=32 LINE_W=8 LINES=64 WAYS=1 \
           POLICY=LRU DB_LATENCY=1 READ_REORDER_DEPTH=8 ASSERT=1 \
           TESTCASE=test_wrap_fill_allwords,test_sparse_boundary_zero_one,test_midline_fill_is_wrap,test_wrap_fill_backpressure,test_wrap_fill_concurrent,test_wrap_fill_refill_direct_mapped
          # Negative control for modulo-RATIO rather than burst-boundary wrapping.
          rm -rf sim_build
          timeout 300 make MODULE=test_shim_wrap_negative \
           WIDE_W=32 NARROW_W=32 LINE_W=8 LINES=128 WAYS=1 \
           POLICY=LRU DB_LATENCY=1 READ_REORDER_DEPTH=8 ASSERT=1

      - name: Generic IDs, reorder depth, and exact LRU
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Smallest ID space / write FIFO edge.
          rm -rf sim_build
          timeout 300 make MODULE=test_shim_id_depth \
           WIDE_W=32 NARROW_W=32 ID_W=1 READ_REORDER_DEPTH=1 \
           MAX_OUTSTANDING_W=1 LINE_W=8 LINES=64 WAYS=2
          # Non-power-of-two maximum legal ROB depth.
          rm -rf sim_build
          timeout 300 make MODULE=test_shim_reorder \
           WIDE_W=32 NARROW_W=32 ID_W=3 READ_REORDER_DEPTH=7 \
           MAX_OUTSTANDING_W=8 LINE_W=8 LINES=64 WAYS=2 DB_LATENCY=2
          # Wrapper memory-ID namespace at a non-default width.
          rm -rf sim_build
          timeout 300 make MODULE=test_l2top_ids ID_W=2 M_ID_W=3 \
           LINE_W=8 LINES=64 WAYS=2
          # Wide core IDs exercise reset of large protocol-tracking tables.
          rm -rf sim_build
          timeout 300 make MODULE=test_reset_recovery \
           ID_W=7 LINE_W=8 LINES=64 WAYS=2
          # Compressed LRU tables (3/4-way) must match strict software LRU.
          for ways in 3 4; do
           rm -rf sim_build
           timeout 300 make MODULE=test_lru_exact POLICY=LRU \
             WAYS=$ways LINES=32 LINE_W=8
          done

      - name: Memory response error contract
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          pytest -q test_mem_error_matrix.py
          pytest -q \
            'test_geometry_matrix.py::test_invalid_geometry_rejected[policy-name]' \
            'test_geometry_matrix.py::test_invalid_geometry_rejected[policy-value]'

      - name: Read reorder buffer and concurrent-hit response framing
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Reorder buffer: a single engine id keeps N reads outstanding, delivered
          # in issue order incl. out-of-order cache completion (miss + warm hits).
          rm -rf sim_build; timeout 300 make MODULE=test_shim_reorder READ_REORDER_DEPTH=8
          # Concurrent hits must return exactly one framed response per request.
          rm -rf sim_build; timeout 300 make MODULE=test_shim_multiread TESTCASE=test_distinct_id_hit_concurrency BLOCK_OFF=64
          rm -rf sim_build; timeout 300 make MODULE=test_shim_multiread TESTCASE=test_distinct_id_hit_concurrency DB_LATENCY=2

      - name: Same-ID eviction-burst liveness
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Back-to-back same-id reads that pipeline dirty evictions must not
          # wedge the cache (needs_rdata double-set -> inuse stuck SET). Small
          # geometry so the round-robin burst actually evicts; both DB latencies.
          for dbl in 1 2; do
            rm -rf sim_build
            timeout 300 make MODULE=test_burst_idle LINES=2 WAYS=2 DB_LATENCY=$dbl
          done

      - name: Accept/finish occupancy collision
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Mixed-R/W eviction stress with Verilator SVA checking on, so the
          # inuse_id/line_no_same_cycle_collide invariants are enforced.
          rm -rf sim_build
          timeout 400 make MODULE=test_inuse_race LINES=16 WAYS=2 VICTIM=1 ASSERT=1

      - name: VICTIM=1 path (smoke + cbom + victim directed)
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          for mod in test_smoke test_cbom test_victim; do
            rm -rf sim_build sim_build_shim
            VICTIM=1 timeout 300 make MODULE=$mod
          done

      - name: WAYS=1 direct-mapped configuration
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # WAYS=1 (the direct-mapped deployment config) must build under
          # Verilator (POLICY_W + zero-width way-index guards) and function.
          for mod in test_smoke test_eviction test_flush test_random; do
            rm -rf sim_build
            timeout 400 make MODULE=$mod WAYS=1
          done
          rm -rf sim_build
          timeout 400 make MODULE=test_inuse_race WAYS=1 LINES=16 VICTIM=1 ASSERT=1

      - name: DATABANK_SDP=1 (UltraRAM mode smoke + correctness)
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Run the core regression with the SDP databank enabled so that
          # the port-1-disable gating (l2_databank.sv) and the dedicated
          # sdp_ram_uram primitive stay verified on every PR. See
          # See doc/INTERFACING.md section 5.1.
          # Restrict to 3 fast modules on PR CI so we stay within the
          # job timeout; the full 9-module sweep with SDP=1 runs in the
          # local nightly.
          for mod in test_smoke test_cbom test_backpressure; do
            rm -rf sim_build sim_build_shim
            EXTRA_ARGS="+define+TC_DATABANK_SDP=1" SEED=1 \
                timeout 300 make MODULE=$mod
            rm -rf sim_build sim_build_shim
          done

      - name: GRASP path (directed + SDP cross-product)
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          # Directed GRASP correctness suite (5 cases): hot retention,
          # SRRIP-FP fallback (regions=0), invalid region (_h<_l),
          # runtime reconfig, hot/moderate overlap precedence.
          # See doc/ARCHITECTURE.md §7.1 "Address-aware policy classification".
          rm -rf sim_build
          POLICY=GRASP timeout 300 make MODULE=test_grasp
          # Multi-window GRASP (N>1 region windows): directed correctness
          # (5 cases) + the fallback/single/multi hit-rate perf demo. These
          # need the region-count build flags (the region ports widen with
          # GRASP_HIGH_REGIONS / GRASP_MODERATE_REGIONS). The full 9-cell
          # config matrix (grasp_multi_matrix.sh) is the local nightly target.
          rm -rf sim_build
          POLICY=GRASP GRASP_HIGH_REGIONS=2 GRASP_MODERATE_REGIONS=2 \
              timeout 300 make MODULE=test_grasp_multi
          rm -rf sim_build
          POLICY=GRASP GRASP_HIGH_REGIONS=4 timeout 300 make MODULE=test_grasp_multi_perf
          # GRASP under the URAM-deployment storage (DATABANK_SDP=1): smoke,
          # workload, and the multi-window directed suite, to catch SDP/GRASP
          # integration drift on the actual deployment databank. The full
          # 9-cell config matrix (grasp_multi_matrix.sh) and 18-module SDP
          # cross-product (grasp_stress.sh) are the local nightly targets.
          for mod in test_smoke test_workload; do
            rm -rf sim_build sim_build_shim
            EXTRA_ARGS="+define+TC_DATABANK_SDP=1" POLICY=GRASP \
                timeout 300 make MODULE=$mod
            rm -rf sim_build sim_build_shim
          done
          rm -rf sim_build sim_build_shim
          EXTRA_ARGS="+define+TC_DATABANK_SDP=1" POLICY=GRASP \
              GRASP_HIGH_REGIONS=2 GRASP_MODERATE_REGIONS=2 \
              timeout 300 make MODULE=test_grasp_multi
          rm -rf sim_build sim_build_shim

      - name: Scheduled extended behavioral coverage
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          for mod in test_cbom_stress test_graph_patterns test_realism \
                     test_set_coverage; do
            rm -rf sim_build*
            timeout 900 make MODULE="$mod"
          done
          rm -rf sim_build*
          POLICY=GRASP timeout 900 make MODULE=test_grasp_midburst
          timeout 1800 ./cov_functional.sh

  address-widths:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 33
            high: "0x1FFFFFFFF"
          - width: 34
            high: "0x3FFFFFFFF"
          - width: 64
            high: "0xFFFFFFFFFFFFFFFF"
    steps:
      - uses: actions/checkout@v4

      - name: Cache built Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/verilator
            /usr/local/bin/verilator_*
            /usr/local/share/verilator
          key: verilator-bin-${{ runner.os }}-5.020

      - name: Install Verilator 5.020 + Python deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make autoconf g++ flex bison ccache \
            libunwind-dev libgoogle-perftools-dev numactl perl-doc \
            libfl2 libfl-dev zlib1g zlib1g-dev \
            help2man python3 python3-pip python3-venv
          if ! command -v verilator >/dev/null || \
             ! verilator --version | grep -q '5\.020' || \
             [ ! -f /usr/local/share/verilator/include/verilated_std.sv ]; then
            git clone --depth 1 --branch v5.020 \
              https://github.com/verilator/verilator.git /tmp/verilator
            cd /tmp/verilator
            autoconf && ./configure --prefix=/usr/local
            make -j"$(nproc)"
            sudo make install
          fi
          verilator --version

      - name: Python venv + cocotb stack
        working-directory: tb/cocotb
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Address width ${{ matrix.width }}
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          width=${{ matrix.width }}
          high=${{ matrix.high }}
          rm -rf sim_build
          TC_REQUIRE_HIGH_ALIAS=1 timeout 300 make MODULE=test_smoke \
            ADDR_W=$width ADDR_L=0 ADDR_H=$high
          rm -rf sim_build
          timeout 400 make MODULE=test_eviction VICTIM=1 \
            ADDR_W=$width ADDR_L=0 ADDR_H=$high
          rm -rf sim_build
          timeout 400 make MODULE=test_flush VICTIM=1 \
            ADDR_W=$width ADDR_L=0 ADDR_H=$high
          rm -rf sim_build
          TC_REQUIRE_HIGH_ALIAS=1 timeout 300 make MODULE=test_l2top \
            ADDR_W=$width ADDR_L=0 ADDR_H=$high
          rm -rf sim_build sim_build_shim
          TC_REQUIRE_HIGH_ALIAS=1 timeout 400 make MODULE=test_shim_cache \
            ADDR_W=$width ADDR_L=0 ADDR_H=$high
          pytest -q test_matrix.py::test_non_napot_range_is_rejected

      - name: 64-bit fixed-window and GRASP paths
        if: matrix.width == 64
        working-directory: tb/cocotb
        run: |
          . .venv/bin/activate
          set -e
          rm -rf sim_build
          timeout 400 make MODULE=test_eviction VICTIM=1 ADDR_W=64 \
            ADDR_L=0x100000000 ADDR_H=0x1FFFFFFFF
          rm -rf sim_build
          timeout 400 make MODULE=test_grasp POLICY=GRASP ADDR_W=64 \
            ADDR_L=0 ADDR_H=0xFFFFFFFFFFFFFFFF

  formal:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install yosys + pinned z3
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys python3-venv
          python3 -m venv tb/formal/.venv
          tb/formal/.venv/bin/pip install -r tb/formal/requirements.txt
          # Ubuntu 22.04's apt yosys is ~0.9 -- older than the 0.33 the
          # local formal stack pins but new enough for the smtbmc options
          # tb/formal/Makefile uses (--presat, -s z3, -i, -t N have been
          # stable for years). If a proof fails on old yosys, the error
          # message will be specific ("unknown command ...") and we can
          # bump to a yosys-from-source build at that point. Avoid the
          # yowasp-yosys fallback because yowasp-yosys-smtbmc isn't a real
          # PyPI package and conjuring an alternative isn't worth the
          # complexity for an already-niche job.
          yosys -V
          yosys-smtbmc --help 2>&1 | head -3 || true
          tb/formal/.venv/bin/z3 --version

      - name: Install sv2v v0.0.13
        run: |
          set -eux
          curl -fsSL -o /tmp/sv2v.zip \
            "https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip"
          unzip -oq /tmp/sv2v.zip -d /tmp/
          # sv2v release archives use either
          # /tmp/sv2v-Linux/sv2v  or  /tmp/sv2v (bare). Locate the binary
          # robustly so a layout change upstream doesn't break CI.
          SV2V_BIN=$(find /tmp -maxdepth 3 -type f -name sv2v -perm -u+x 2>/dev/null | head -1)
          if [ -z "$SV2V_BIN" ]; then
              echo "ERROR: sv2v binary not found inside the release zip; layout:"
              find /tmp -maxdepth 3 -name 'sv2v*' -print
              exit 1
          fi
          sudo cp "$SV2V_BIN" /usr/local/bin/sv2v
          sudo chmod +x /usr/local/bin/sv2v
          sv2v --version

      - name: Run formal proofs and covers
        working-directory: tb/formal
        run: make all
